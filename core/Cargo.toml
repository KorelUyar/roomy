[package]
name = "roomy-core"
version = "0.1.0"
description = "Disk scanning, app discovery and cleanup logic behind Roomy."
authors = ["Korel Uyar"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
trash = "5"
dirs = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSData", "NSDictionary", "NSURL", "NSError", "NSValue", "NSArray", "NSGeometry", "NSFileManager"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSRunningApplication", "NSGraphicsContext", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", features = ["CGImage"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
png = "0.17"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "roomy-cli"
path = "src/bin/cli.rs"
